name: release

on:
  push:
    tags:
      - "v*"

# Cancel in-flight runs for the same tag (rare, but harmless to set).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build (${{ matrix.platform.label }})
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - label: macos-aarch64
            runner: macos-latest
            target: aarch64-apple-darwin
          - label: macos-x86_64
            runner: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.platform.label }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend deps
        run: bun install --frozen-lockfile

      - name: Build, sign, notarize, and upload
        uses: tauri-apps/tauri-action@v0
        env:
          # Apple code-signing identity. APPLE_CERTIFICATE is the base64 of a
          # .p12 export of your Developer ID Application cert; tauri-action
          # imports it into a temporary keychain for the duration of the job.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

          # Apple notarization. APPLE_PASSWORD is an app-specific password.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Creates the GitHub Release the first job to run; subsequent
          # matrix jobs append their artifacts to the same release.
          tagName: ${{ github.ref_name }}
          releaseName: "Open Security ${{ github.ref_name }}"
          releaseBody: |
            **macOS:** download the matching `.dmg` for your chip (Apple Silicon → `aarch64`, Intel → `x86_64`), drag to Applications.
          releaseDraft: false
          prerelease: false
          args: --target ${{ matrix.platform.target }}
