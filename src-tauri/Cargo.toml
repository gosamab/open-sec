[package]
name = "open-sec"
version = "0.1.0"
description = "AI-powered security code scanner"
authors = ["Osama Azab <gosamab@hotmail.com>"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"
default-run = "open-sec"

[lib]
name = "open_sec_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.1", features = [] }
tokio = { version = "1.52.3", features = ["full", "tracing"] }
async-trait = "0.1.89"
anyhow = "1.0.102"
thiserror = "2.0.18"
dotenvy = "0.15.7"
ignore = "0.4.25"
diffy = "0.4.2"
sha2 = "0.10.9"
keyring = "3.6.3"
rusqlite = { version = "0.39.0", features = ["bundled"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
tauri-plugin-dialog = "2.7.1"
tree-sitter = "0.26.8"
tree-sitter-rust = "0.24.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
tree-sitter-dart = "0.2.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-c-sharp = "0.23.5"
regex = "1.12.3"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
